    <!-- Applies the saved theme (see ThemeContext.jsx, key "pos_theme")
         to <html> before the app's first paint, on every route — this
         page previously had no such script, so the app briefly flashed
         light-mode styling on every load/refresh before React mounted
         and ThemeProvider's own useEffect caught up. Wrapped in
         try/catch purely for private-browsing modes that can throw on
         localStorage access; failing silently just leaves the default
         light theme, same as before this script existed. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('pos_theme') === 'DARK') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
